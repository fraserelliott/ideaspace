  <body>
    <script>
      const params = new URLSearchParams(location.search);
      const path = params.get("p");

      if (path) {
        const query = params.get("q");
        const hash = params.get("h");

        history.replaceState(
          null,
          "",
          path +
            (query ? "?" + query : "") +
            (hash ? "#" + hash : "")
        );
      }
    </script>
